# ============================================================
# ShopStream — Production Overrides
# Apply explicitly:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
# ============================================================

services:

  postgres:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  mongodb:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M

  user-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  product-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  order-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  inventory-service:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M

  api-gateway:
    restart: always
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 128M
